<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="夢追翔がこれまで歌唱した曲を検索・視聴できる非公式データベース">
  <title>夢追翔の歌った曲リスト</title>
  <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">UNOFFICIAL SONG ARCHIVE</p>
        <h1>夢追翔の歌った曲リスト</h1>
      </div>
      <p class="header-note">曲名・アーティスト・配信名・タグから検索できます</p>
    </div>
  </header>

<section
  id="player-panel"
  class="player-panel"
  hidden
>
  <div class="player-shell">
    <!-- 常に残る部分 -->
    <div class="player-statusbar">
      <div class="player-equalizer" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="player-info">
        <p class="player-label">
          🔻NOW PLAYING🔻
        </p>

        <strong id="player-title">
          選択した楽曲
        </strong>

        <span id="player-artist"></span>
      </div>

      <div class="player-controls">
        <button
          id="next-player"
          class="player-button"
          type="button"
        >
          次の曲
        </button>

        <button
          id="close-player"
          class="icon-button"
          type="button"
          aria-label="プレーヤーを閉じる"
        >
          ×
        </button>
      </div>
    </div>

    <!-- 開閉する部分 -->
    <div class="player-video-wrap">
      <div
        id="player-video-area"
        class="player-frame-wrap"
      >
        <div id="youtube-player"></div>
      </div>

      <!-- 必ず動画より後ろ -->
      <div class="player-fold-row">
        <button
          id="toggle-player-video"
          class="player-fold-button"
          type="button"
          aria-expanded="true"
          aria-controls="player-video-area"
          aria-label="動画を収納"
          title="動画を収納"
        >
          <span
            class="player-fold-icon"
            aria-hidden="true"
          ></span>
        </button>
      </div>
    </div>
  </div>
</section>

    <div class="layout">
<aside class="filters" aria-label="検索と絞り込み">
  <!-- ウィンドウ上部 -->
  <div class="filter-window-bar" aria-hidden="true">
    <span class="filter-window-dot"></span>
    <span class="filter-window-dot"></span>
    <span class="filter-window-dot"></span>

    <span class="filter-window-title">TAG FILTER</span>
  </div>

  <div class="filter-body">
    <div class="filter-heading">
      <h2>絞り込み</h2>

      <button
        id="reset-btn"
        class="text-button"
        type="button"
      >
        RESET
      </button>
    </div>

    <label class="field">
      <span>キーワード検索</span>

      <input
        id="search-input"
        type="search"
        placeholder="曲名、アーティスト、コラボ…"
      >
    </label>

    <label class="field">
      <span>並べ替え</span>

      <select id="sort-select">
        <option value="date-desc">日付：新しい順</option>
        <option value="date-asc">日付：古い順</option>
        <option value="title-asc">曲名：昇順</option>
        <option value="title-desc">曲名：降順</option>
        <option value="artist-asc">アーティスト：昇順</option>
        <option value="artist-desc">アーティスト：降順</option>
      </select>
    </label>

    <label class="favorite-toggle">
      <input
        id="favorites-only"
        type="checkbox"
      >

      <span>お気に入りのみ</span>
      <small id="favorite-count">0</small>
    </label>

    <!-- 選択中のタグ -->
    <div
      id="selected-filters"
      class="selected-filters"
      hidden
    ></div>

    <!-- タグを選ぶ -->
    <details
      id="tag-filter-panel"
      class="tag-filter-panel"
      open
    >
      <summary>
        <span>タグを選ぶ</span>

        <span
          id="selected-filter-count"
          class="filter-count"
        >
          0
        </span>
      </summary>

      <div class="tag-filter-content">
        <fieldset class="filter-group">
          <legend>形態・種類</legend>

          <div
            id="filter-type"
            class="button-group"
          ></div>
        </fieldset>

        <fieldset class="filter-group">
          <legend>歌唱・ライブ名</legend>

          <div
            id="filter-sing"
            class="button-group"
          ></div>
        </fieldset>
      </div>
    </details>
  </div>
  
</aside>
      <section class="results" aria-live="polite">
        <div class="results-header">
          <div>
            <p class="result-count"><strong id="count">0</strong> 曲</p>
            <p id="active-summary" class="active-summary">すべて表示中</p>
          </div>
          <button id="shuffle-btn" class="primary-button" type="button" aria-pressed="false">
            シャッフル再生
          </button>
        </div>

        <div id="song-list" class="song-grid"></div>

        <div id="empty-state" class="empty-state" hidden>
          <p>条件に一致する楽曲がありません。</p>
          <button class="primary-button" type="button" data-reset>条件をリセット</button>
        </div>

        <div class="load-more-wrap">
          <button id="load-more" class="secondary-button" type="button" hidden>さらに表示</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    非公式ファンサイトです。各コンテンツの権利は権利者に帰属します。
  </footer>

 <button
  id="page-top"
  class="page-top-button"
  type="button"
  aria-label="ページトップへ戻る"
  title="ページトップへ戻る"
>
  <span class="page-top-icon" aria-hidden="true"></span>
</button>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
