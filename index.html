<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="夢追翔がこれまで歌唱した曲を検索・視聴できる非公式データベース">
  <title>夢追翔の歌った曲リスト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">UNOFFICIAL SONG ARCHIVE</p>
        <h1>夢追翔の歌った曲リスト</h1>
      </div>
      <p class="header-note">曲名・アーティスト・配信名・タグから検索できます</p>
    </div>
  </header>

  <main class="page-shell">
    <section class="mode-panel" aria-label="表示モード">
      <div>
        <strong>表示モード</strong>
        <p id="mode-description">現在YouTube上で視聴できる楽曲を主に表示します</p>
      </div>
      <div class="segmented-control" role="group" aria-label="表示モードを選択">
        <button id="mode-quick" class="active" type="button" aria-pressed="true">すぐ聴く</button>
        <button id="mode-all" type="button" aria-pressed="false">全記録</button>
      </div>
    </section>

    <div class="layout">
      <aside class="filters" aria-label="検索と絞り込み">
        <div class="filter-window-bar" aria-hidden="true">
          <span class="filter-window-dot"></span>
          <span class="filter-window-dot"></span>
          <span class="filter-window-dot"></span>
          <span class="filter-window-title">TAG FILTER</span>
        </div>

        <div class="filter-body">
          <div class="filter-heading">
            <h2>絞り込み</h2>
            <button id="reset-btn" class="text-button" type="button">RESET</button>
          </div>

          <label class="field">
            <span>キーワード検索</span>
            <input id="search-input" type="search" placeholder="曲名、アーティスト、コラボライバー名、枠名…">
          </label>

          <label class="field">
            <span>並べ替え</span>
            <select id="sort-select">
              <option value="date-desc">日付：新しい順</option>
              <option value="date-asc">日付：古い順</option>
              <option value="title-asc">曲名：昇順</option>
              <option value="title-desc">曲名：降順</option>
              <option value="artist-asc">アーティスト：昇順</option>
              <option value="artist-desc">アーティスト：降順</option>
            </select>
          </label>

          <label class="favorite-toggle">
            <input id="favorites-only" type="checkbox">
            <span>お気に入りのみ</span>
            <small id="favorite-count">0</small>
          </label>

          <div id="selected-filters" class="selected-filters" hidden></div>

          <details id="tag-filter-panel" class="tag-filter-panel" open>
            <summary>
              <span>タグを選択</span>
              <span id="selected-filter-count" class="filter-count">0</span>
            </summary>
            
<div class="tag-filter-content">
  <!-- type -->
  <fieldset class="filter-group">
    <legend>楽曲タイプ</legend>

    <div
      id="filter-type"
      class="button-group"
    ></div>
  </fieldset>

  <!-- 人数 -->
  <fieldset class="filter-group">
    <legend>歌唱人数</legend>

    <div
      id="filter-sing-count"
      class="button-group"
    ></div>
  </fieldset>

  <!-- 歌唱形式 -->
  <fieldset class="filter-group">
    <legend>歌唱形式</legend>

    <div
      id="filter-sing-style"
      class="button-group"
    ></div>
  </fieldset>

  <!-- ユニット -->
  <fieldset class="filter-group">
    <legend>ユニット名</legend>

    <div
      id="filter-sing-unit"
      class="button-group"
    ></div>
  </fieldset>

  <!-- ライブ・イベント -->
  <fieldset class="filter-group">
    <legend>ライブ名</legend>

    <div
      id="filter-sing-event"
      class="button-group"
    ></div>
  </fieldset>

  <!-- その他 -->
  <fieldset class="filter-group">
    <legend>その他</legend>

    <div
      id="filter-sing-other"
      class="button-group"
    ></div>
  </fieldset>
</div>
            
          </details>
        </div>
      </aside>

      <section class="results" aria-live="polite">
        <div class="results-header">
          <div>
            <p class="result-count"><strong id="count">0</strong> 曲</p>
            <p id="active-summary" class="active-summary">すぐ聴ける曲を表示中</p>
          </div>
          <button id="shuffle-btn" class="primary-button" type="button" aria-pressed="false">シャッフル再生</button>
        </div>

        <section id="player-panel" class="player-panel" hidden aria-label="動画プレーヤー">
          <div class="player-statusbar">
            <div class="player-equalizer" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div class="player-info">
              <p class="player-label">🔻NOW PLAYING🔻</p>
              <strong id="player-title">選択した楽曲</strong>
              <span id="player-artist"></span>
            </div>
            <div class="player-controls">
              <button id="next-player" class="player-button" type="button">シャッフル</button>
              <button id="close-player" class="icon-button" type="button" aria-label="プレーヤーを閉じる" title="プレーヤーを閉じる">×</button>
            </div>
          </div>

          <div class="player-video-wrap">
            <div id="player-video-area" class="player-frame-wrap">
              <div id="youtube-player"></div>
            </div>
            <div class="player-fold-row">
              <button id="toggle-player-video" class="player-fold-button" type="button" aria-expanded="true" aria-controls="player-video-area" aria-label="動画を収納" title="動画を収納">
                <span class="player-fold-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </section>

        <div id="song-list" class="song-grid"></div>

        <div id="empty-state" class="empty-state" hidden>
          <p>条件に一致する楽曲がありません。</p>
          <button class="primary-button" type="button" data-reset>条件をリセット</button>
        </div>

        <div class="load-more-wrap">
          <button id="load-more" class="secondary-button" type="button" hidden>さらに表示</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">非公式ファンサイトです。各コンテンツの権利は権利者に帰属します。</footer>

  <button id="page-top" class="page-top-button" type="button" aria-label="ページトップへ戻る" title="ページトップへ戻る">
    <span class="page-top-icon" aria-hidden="true"></span>
  </button>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
