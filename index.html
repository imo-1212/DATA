<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="夢追翔がこれまで歌唱した曲を検索・視聴できる非公式データベース">
  <title>歌唱曲データベース</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">UNOFFICIAL SONG ARCHIVE</p>
        <h1>歌唱曲データベース</h1>
      </div>
      <p class="header-note">曲名・アーティスト・配信名・タグから検索できます</p>
    </div>
  </header>

  <section id="player-panel" class="player-panel" hidden>
    <div class="player-inner">
      <div class="player-info">
        <p class="eyebrow">🔻NOW PLAYING🔻</p>
        <strong id="player-title">選択した楽曲</strong>
        <span id="player-artist"></span>
      </div>

      <div class="player-frame-wrap">
        <div id="youtube-player"></div>
      </div>

      <div class="player-controls">
        <button id="next-player" class="player-button" type="button">次の曲</button>
        <button id="close-player" class="icon-button" type="button" aria-label="プレーヤーを閉じる">×</button>
      </div>
    </div>
  </section>

  <main class="page-shell">
    <section class="mode-panel" aria-label="表示モード">
      <div>
        <strong>表示モード</strong>
        <p id="mode-description">現在Youtube上で視聴できる楽曲のみを表示します</p>
      </div>
      <div class="segmented-control">
        <button id="mode-quick" type="button" data-mode="quick" aria-pressed="true">すぐ聴く</button>
        <button id="mode-all" type="button" data-mode="all" aria-pressed="false">全記録</button>
      </div>
    </section>

    <div class="layout">
      <aside class="filters" aria-label="検索と絞り込み">
        <div class="filter-heading">
          <h2>絞り込み</h2>
          <button id="reset-btn" class="text-button" type="button">リセット</button>
        </div>

        <label class="field">
          <span>キーワード検索</span>
          <input id="search-input" type="search" placeholder="曲名、アーティスト、コラボ…">
        </label>

        <label class="field">
          <span>並べ替え</span>
          <select id="sort-select">
            <option value="date-desc">日付：新しい順</option>
            <option value="date-asc">日付：古い順</option>
            <option value="title-asc">曲名：昇順</option>
            <option value="title-desc">曲名：降順</option>
            <option value="artist-asc">アーティスト：昇順</option>
            <option value="artist-desc">アーティスト：降順</option>
          </select>
        </label>

        <label class="favorite-toggle">
          <input id="favorites-only" type="checkbox">
          <span>お気に入りのみ</span>
          <small id="favorite-count">0</small>
        </label>

        <div id="selected-filters" class="selected-filters" hidden></div>

        <details id="tag-filter-panel" class="tag-filter-panel">
          <summary>
            <span>タグを選ぶ</span>
            <span id="selected-filter-count" class="filter-count">0</span>
          </summary>
          <div class="tag-filter-content">
            <fieldset class="filter-group">
              <legend>形態・種類</legend>
              <div id="filter-type" class="button-group"></div>
            </fieldset>

            <fieldset class="filter-group">
              <legend>歌唱・ライブ名</legend>
              <div id="filter-sing" class="button-group"></div>
            </fieldset>
          </div>
        </details>
      </aside>

      <section class="results" aria-live="polite">
        <div class="results-header">
          <div>
            <p class="result-count"><strong id="count">0</strong> 曲</p>
            <p id="active-summary" class="active-summary">すべて表示中</p>
          </div>
          <button id="shuffle-btn" class="primary-button" type="button" aria-pressed="false">
            シャッフル再生
          </button>
        </div>

        <div id="song-list" class="song-grid"></div>

        <div id="empty-state" class="empty-state" hidden>
          <p>条件に一致する楽曲がありません。</p>
          <button class="primary-button" type="button" data-reset>条件をリセット</button>
        </div>

        <div class="load-more-wrap">
          <button id="load-more" class="secondary-button" type="button" hidden>さらに表示</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    非公式ファンサイトです。各コンテンツの権利は権利者に帰属します。
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
